<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirecting...</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #fff;
            text-align: center;
        }

        .redirect-box {
            padding: 30px;
        }

        .countdown {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="redirect-box">
        <h2>Redirecting you...</h2>
        <p>Please wait while we take you to AJIO.</p>

        <div class="countdown" id="countdown">5</div>

        <p>You will be redirected automatically.</p>
    </div>

    <script>
        const affiliateURL = "https://tracking.ajio.business/click?pid=156&offer_id=2&sub1=M3_{siteid}";
        let seconds = 5;

        const countdown = document.getElementById("countdown");

        const timer = setInterval(function () {
            seconds--;
            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = affiliateURL;
            }
        }, 1000);
    </script>

</body>
</html>
